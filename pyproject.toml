[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rills"
version = "0.1.0"
description = "A lightweight, single-node micro-batching engine designed for high-performance streaming analytics using pure PyArrow and DuckDB."
readme = "README.md"
authors = [
    { name = "LIJOSE" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
keywords = ["streaming", "pyarrow", "duckdb", "micro-batching", "analytics"]

requires-python = ">=3.9"
dependencies = [
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "psutil>=5.9.0"
]

[project.urls]
Homepage = "https://github.com/lijose/rill"
Repository = "https://github.com/lijose/rill"
"Bug Tracker" = "https://github.com/lijose/rill/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.1.0",
    "numpy>=1.24.0"
]
connectors = [
    "confluent-kafka>=2.0.0"
]

[tool.setuptools.package-data]
rills = ["py.typed"]


[tool.setuptools.packages.find]
where = ["."]
include = ["rills*"]
